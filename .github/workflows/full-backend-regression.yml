name: Full Backend Regression

on:
  schedule:
    # UTC; complete regression remains separate from ordinary change-scoped CI.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  full-backend-unit-tests:
    runs-on: ubuntu-latest
    # Comfortably above the observed approximately 57-minute full regression.
    timeout-minutes: 180
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Run full unit tests
        run: python -m pytest tests/unit/ -q --no-header --no-cov
