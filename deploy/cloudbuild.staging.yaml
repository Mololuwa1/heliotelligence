# Staging deployment template.
#
# This file is intentionally not connected to a Cloud Build trigger yet.
# Provision the staging project/database/secrets first, then configure a trigger
# to use this file. See docs/deployment-environments.md.

substitutions:
  _STAGING_PROJECT_ID: heliotelligence-staging
  _REGION: europe-west2
  _ARTIFACT_REPOSITORY: heliotelligence
  _IMAGE_NAME: api
  _SERVICE_NAME: heliotelligence-api-staging
  _CORS_ORIGINS: http://localhost:5173

steps:
  - name: 'python:3.13-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -e ".[dev]" -q
        python -m pytest tests/unit/ -q --no-header --no-cov
    env:
      - 'DATABASE_URL=postgresql://test:test@localhost/test'
      - 'APP_ENV=development'
    id: 'test'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_STAGING_PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA'
      - '.'
    id: 'build'
    waitFor: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${_STAGING_PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA'
    id: 'push'
    waitFor: ['build']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--project=${_STAGING_PROJECT_ID}'
      - '--image=${_REGION}-docker.pkg.dev/${_STAGING_PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,SOLCAST_API_KEY=SOLCAST_API_KEY:latest,SECRET_KEY=SECRET_KEY:latest,ADMIN_API_KEY=ADMIN_API_KEY:latest,FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest'
      - '--set-env-vars=SITE_CONFIG_PATH=config/sites.yaml,APP_ENV=staging,CORS_ORIGINS=${_CORS_ORIGINS}'
    id: 'deploy'
    waitFor: ['push']

images:
  - '${_REGION}-docker.pkg.dev/${_STAGING_PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
